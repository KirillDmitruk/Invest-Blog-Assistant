name: Private Pulse drafts
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Rubric (auto follows the configured schedule)
        type: choice
        options: [auto, plan, paper, glossary, weekly, monthly]
        default: auto
      send:
        description: Send a private draft (never publish to Pulse)
        type: boolean
        default: false
      diagnose:
        description: Read-only connection check; never sends a draft
        type: boolean
        default: false
      preview_lesson:
        description: Generate a public educational preview without sending or portfolio reads
        type: boolean
        default: false
      example:
        description: Send one deduplicated updated paper example privately
        type: boolean
        default: false
  schedule:
    - cron: '0 7 * * 1,3,5,6'
    - cron: '0 8 1 * *'
permissions:
  contents: read
concurrency:
  group: private-pulse-drafts
  cancel-in-progress: false
jobs:
  draft:
    if: vars.CLOUD_PULSE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.kind != 'auto')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3' 'cryptography>=44,<47' 'pytest>=8,<10'
      - run: python -m pytest tests/test_cloud_pulse.py tests/test_posts.py tests/test_report_voice.py tests/test_pulse_editor.py tests/test_investment_lessons.py -q
      - name: Generate privately; send only when enabled
        env:
          PULSE_TINVEST_TOKEN: ${{ secrets.PULSE_TINVEST_TOKEN }}
          PULSE_ACCOUNT_IDS: ${{ secrets.PULSE_ACCOUNT_IDS }}
          PULSE_STATE_KEY: ${{ secrets.PULSE_STATE_KEY }}
          SIGNALS_BOT_TOKEN: ${{ secrets.SIGNALS_BOT_TOKEN }}
          SIGNALS_CHAT_ID: ${{ secrets.SIGNALS_CHAT_ID }}
          GH_STATE_TOKEN: ${{ github.token }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          KIND: ${{ inputs.kind || 'auto' }}
          SEND: ${{ github.event_name == 'schedule' || inputs.send }}
          DIAGNOSE: ${{ inputs.diagnose }}
          EXAMPLE: ${{ inputs.example }}
          PREVIEW_LESSON: ${{ inputs.preview_lesson }}
        run: |
          if [ "$PREVIEW_LESSON" = "true" ]; then
            python -m invest_blog.investment_lessons
          elif [ "$EXAMPLE" = "true" ]; then
            python -m invest_blog.cloud_pulse --kind paper --send --example
          elif [ "$DIAGNOSE" = "true" ]; then
            python -m invest_blog.cloud_pulse --kind "$KIND" --check
          elif [ "$SEND" = "true" ]; then
            python -m invest_blog.cloud_pulse --kind "$KIND" --send
          else
            python -m invest_blog.cloud_pulse --kind "$KIND"
          fi
      # No artifacts: drafts, portfolio, account ids and broker responses are private.
