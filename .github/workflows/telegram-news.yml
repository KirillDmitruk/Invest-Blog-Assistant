name: Telegram investment news
on:
  workflow_dispatch:
    inputs:
      send:
        description: Publish one fresh news post to the configured channel
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: telegram-investment-news
  cancel-in-progress: false
jobs:
  publish:
    if: vars.CLOUD_NEWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3' 'cryptography>=44,<47' 'pytest>=8,<10'
      - run: python -m pytest tests/test_news_editor.py tests/test_cloud_news.py tests/test_news_article.py -q
      - name: Prepare one post; publish only when requested
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GH_STATE_TOKEN: ${{ github.token }}
          PULSE_STATE_KEY: ${{ secrets.PULSE_STATE_KEY }}
          SIGNALS_BOT_TOKEN: ${{ secrets.SIGNALS_BOT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          SEND: ${{ inputs.send }}
        run: |
          if [ "$SEND" = "true" ]; then
            python -m invest_blog.cloud_news --send
          else
            python -m invest_blog.cloud_news
          fi
