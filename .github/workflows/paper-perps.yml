name: Autonomous PAPER account
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
concurrency:
  group: cloud-paper-perps
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  simulate:
    if: vars.PAPER_ENABLED == 'true' && vars.TRADING_MODE == 'paper'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3' 'cryptography>=43,<47' 'pytest>=8,<10'
      - name: Verify virtual accounting and execution boundaries
        run: python -m pytest tests/test_paper_perps.py tests/test_paper_boundaries.py tests/test_demo_notifications.py -q
      - name: Simulate with public data only
        env:
          TRADING_MODE: ${{ vars.TRADING_MODE }}
          PAPER_ENABLED: ${{ vars.PAPER_ENABLED }}
          PAPER_STATE_KEY: ${{ secrets.PAPER_STATE_KEY }}
          GH_STATE_TOKEN: ${{ github.token }}
          SIGNALS_BOT_TOKEN: ${{ secrets.SIGNALS_BOT_TOKEN }}
          SIGNALS_CHAT_ID: ${{ secrets.SIGNALS_CHAT_ID }}
        run: python -m invest_blog.paper_cloud
      # No brokerage secrets, no signer, no real-order adapters, no private artifacts.
