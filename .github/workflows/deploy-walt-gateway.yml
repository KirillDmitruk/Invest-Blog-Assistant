name: Deploy Walt Telegram gateway
on:
  workflow_dispatch:
    inputs:
      activate:
        description: Explicitly switch Telegram callbacks to cloud (requires approved Walt state transfer)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloud-walt-manual
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node tests/test_walt_worker.mjs
      - run: python -m pip install 'requests>=2.31,<3' 'cryptography>=43,<47'
      - name: Deploy gateway; activation is opt-in
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_WORKERS_DEPLOY_TOKEN: ${{ secrets.CF_WORKERS_DEPLOY_TOKEN }}
          WALT_GH_DISPATCH_TOKEN: ${{ secrets.WALT_GH_DISPATCH_TOKEN }}
          WALT_BUTTON_KEY: ${{ secrets.WALT_BUTTON_KEY }}
          WALT_EVENT_KEY: ${{ secrets.WALT_EVENT_KEY }}
          TG_WEBHOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
          SIGNALS_BOT_TOKEN: ${{ secrets.SIGNALS_BOT_TOKEN }}
          SIGNALS_CHAT_ID: ${{ secrets.SIGNALS_CHAT_ID }}
          ACTIVATE_WALT_WEBHOOK: ${{ inputs.activate }}
          WALT_CLOUD_STATE_KEY: ${{ secrets.WALT_CLOUD_STATE_KEY }}
          GH_STATE_TOKEN: ${{ github.token }}
        run: python tools/deploy_walt_gateway.py
