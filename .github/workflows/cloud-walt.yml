name: Cloud Walt manual confirmation
on:
  workflow_dispatch:
    inputs:
      event:
        description: Authenticated encrypted Telegram callback
        type: string
        required: true
concurrency:
  group: cloud-walt-manual
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  manual-action:
    if: vars.WALT_TELEGRAM_ENABLED == 'true' && vars.TRADING_MODE != 'paper'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3' 'cryptography>=43,<47' 'pytest>=8,<10'
      - name: Verify authentication and replay boundaries with fake services
        run: python -m pytest tests/test_walt_telegram.py tests/test_walt_cloud_export.py tests/test_walt_groups.py tests/test_walt_leverage.py tests/test_walt_drift.py -q
      - name: Process one authenticated owner action
        env:
          WALT_EVENT: ${{ inputs.event }}
          TRADING_MODE: ${{ vars.TRADING_MODE }}
          WALT_EVENT_KEY: ${{ secrets.WALT_EVENT_KEY }}
          WALT_BUTTON_KEY: ${{ secrets.WALT_BUTTON_KEY }}
          WALT_CLOUD_STATE_KEY: ${{ secrets.WALT_CLOUD_STATE_KEY }}
          SIGNALS_BOT_TOKEN: ${{ secrets.SIGNALS_BOT_TOKEN }}
          SIGNALS_CHAT_ID: ${{ secrets.SIGNALS_CHAT_ID }}
          GH_STATE_TOKEN: ${{ github.token }}
        run: python -m invest_blog.telegram_walt
