name: Deploy five-minute demo scheduler
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: vars.TRADING_MODE == 'paper'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node tests/test_demo_scheduler.mjs
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Deploy independent virtual account clock
        env:
          TRADING_MODE: ${{ vars.TRADING_MODE }}
          CLOUD_NEWS_ENABLED: ${{ vars.CLOUD_NEWS_ENABLED }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_WORKERS_DEPLOY_TOKEN: ${{ secrets.CF_WORKERS_DEPLOY_TOKEN }}
          WALT_GH_DISPATCH_TOKEN: ${{ secrets.WALT_GH_DISPATCH_TOKEN }}
        run: python tools/deploy_demo_scheduler.py
