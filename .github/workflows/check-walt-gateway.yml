name: Check Walt cloud gateway (read only)
on:
  workflow_dispatch:
    inputs:
      url:
        description: Public workers.dev gateway URL
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: cloud-walt-manual
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3' 'cryptography>=43,<47'
      - name: Exercise existing position read only through gateway
        env:
          WALT_GATEWAY_URL: ${{ inputs.url }}
          GH_STATE_TOKEN: ${{ github.token }}
          SIGNALS_CHAT_ID: ${{ secrets.SIGNALS_CHAT_ID }}
          SIGNALS_BOT_TOKEN: ${{ secrets.SIGNALS_BOT_TOKEN }}
          WALT_CLOUD_STATE_KEY: ${{ secrets.WALT_CLOUD_STATE_KEY }}
          WALT_BUTTON_KEY: ${{ secrets.WALT_BUTTON_KEY }}
          TG_WEBHOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
        run: python tools/check_walt_gateway.py
