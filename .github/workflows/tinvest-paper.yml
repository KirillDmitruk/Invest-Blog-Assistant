name: T-Invest virtual futures
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
concurrency:
  group: cloud-tinvest-paper
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  simulate:
    if: vars.TINVEST_PAPER_ENABLED == 'true' && vars.TRADING_MODE == 'paper'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3' 'cryptography>=43,<47' 'pydantic>=2,<3' 'pytest>=8,<10' 'python-dotenv>=1,<2'
      - name: Verify isolated virtual ledger
        run: python -m pytest tests/test_tinvest_paper_cloud.py tests/test_trading_rules_v2.py tests/test_demo_notifications.py -q
      - name: Simulate futures using read-only market data
        env:
          TRADING_MODE: ${{ vars.TRADING_MODE }}
          TINVEST_PAPER_ENABLED: ${{ vars.TINVEST_PAPER_ENABLED }}
          TINVEST_PAPER_STATE_KEY: ${{ secrets.TINVEST_PAPER_STATE_KEY }}
          TINVEST_MARKET_TOKEN: ${{ secrets.PULSE_TINVEST_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          GH_STATE_TOKEN: ${{ github.token }}
          SIGNALS_BOT_TOKEN: ${{ secrets.SIGNALS_BOT_TOKEN }}
          SIGNALS_CHAT_ID: ${{ secrets.SIGNALS_CHAT_ID }}
        run: python -m invest_blog.tinvest_paper_cloud
      # No account IDs and no broker order adapter. Only virtual fills in the encrypted ledger.
